# Deploy da API + PostgreSQL no Render (Blueprint). Dashboard > New > Blueprint > selecione o repositório.
services:
  - type: web
    name: safecash-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CLIENT
        value: pg
      - key: DATABASE_URL
        fromDatabase: { name: safecash-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # preencha com a URL do frontend na Vercel/Netlify
      - key: SEED_ON_START
        value: "true"

databases:
  - name: safecash-db
    plan: free
