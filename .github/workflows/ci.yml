# Integração contínua: todo push e pull request roda os testes e o build.
# Um PR com teste quebrado fica vermelho no GitHub e não deve ser mesclado.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: API (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safecash_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Testes no SQLite
        run: npm test
      - name: Testes no PostgreSQL
        run: npm test
        env:
          DB_CLIENT: pg
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/safecash_test

  frontend:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
